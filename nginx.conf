server {
    listen 7337;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Code and data must always be revalidated (cheap thanks to ETags); otherwise browsers can keep
    # stale modules after an update and end up running a mix of old and new files.
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
